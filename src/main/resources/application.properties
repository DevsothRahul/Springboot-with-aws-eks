# Defaults to an in-memory H2 database so the app runs with zero setup.
# Override with env vars (e.g. from a Kubernetes ConfigMap/Secret) to point at RDS MySQL instead.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:productdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
